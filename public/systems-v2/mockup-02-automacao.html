<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:transparent;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif;}
.card{width:320px;background:#111;border-radius:10px;overflow:hidden;box-shadow:0 28px 72px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);}
.titlebar{height:36px;background:#1a1a1a;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;padding:0 12px;gap:6px;}
.dot{width:10px;height:10px;border-radius:50%;}
.title-txt{font-size:11px;font-weight:500;color:rgba(255,255,255,.3);margin-left:6px;}

.toolbar{background:#1a1a1a;border-bottom:1px solid rgba(255,255,255,.06);padding:7px 14px;display:flex;align-items:center;justify-content:space-between;}
.flow-title{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.7);}
.badge-active{font-size:9px;font-weight:600;padding:2px 8px;border-radius:20px;background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3);}

/* canvas area */
.canvas{
  position:relative;
  background:#111;
  background-image:radial-gradient(circle,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:20px 20px;
  padding:18px 14px 16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
}

/* SVG connector layer */
.connectors{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}

/* nodes */
.node{
  width:250px;
  background:#1c1c1c;
  border:1px solid rgba(255,255,255,.1);
  border-radius:8px;
  display:flex;
  align-items:stretch;
  position:relative;
  z-index:2;
}
.node.active-node{border-color:rgba(99,102,241,.4);box-shadow:0 0 0 2px rgba(99,102,241,.12);}
.node-accent{width:4px;border-radius:8px 0 0 8px;flex-shrink:0;}
.node-body{padding:9px 12px;flex:1;display:flex;align-items:center;gap:10px;}
.node-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.node-text{flex:1;}
.node-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.85);}
.node-sub{font-size:9px;color:rgba(255,255,255,.35);margin-top:2px;}
.node-status{margin-left:auto;flex-shrink:0;}
.status-dot{width:7px;height:7px;border-radius:50%;}

/* port dots */
.port{width:10px;height:10px;border-radius:50%;background:#2a2a2a;border:2px solid rgba(255,255,255,.15);position:absolute;top:50%;transform:translateY(-50%);z-index:3;}
.port-out{right:-5px;}
.port-in{left:-5px;}
.port.live{border-color:#22c55e;background:rgba(34,197,94,.2);}

/* spacer for SVG lines */
.spacer{height:28px;width:100%;}

.footer{background:#1a1a1a;border-top:1px solid rgba(255,255,255,.06);padding:7px 14px;display:flex;justify-content:space-between;align-items:center;}
.ft{font-size:9.5px;color:rgba(255,255,255,.3);}
</style>
</head>
<body>
<div class="card">
  <div class="titlebar">
    <span class="dot" style="background:#ff5f57;"></span>
    <span class="dot" style="background:#ffbd2e;"></span>
    <span class="dot" style="background:#28ca41;"></span>
    <span class="title-txt">fluxo-atendimento.flow</span>
  </div>
  <div class="toolbar">
    <span class="flow-title">Atendimento Automatizado</span>
    <span class="badge-active">Ativo</span>
  </div>

  <div class="canvas" id="canvas">
    <!-- SVG lines drawn by JS -->
    <svg class="connectors" id="svg-lines"></svg>

    <!-- Node 1 -->
    <div class="node" id="n1">
      <div class="node-accent" style="background:#f97316;"></div>
      <div class="node-body">
        <div class="node-icon" style="background:rgba(249,115,22,.14);">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="2" stroke="#f97316" stroke-width="1.4"/><path d="M1 6.5l7 4 7-4" stroke="#f97316" stroke-width="1.4"/></svg>
        </div>
        <div class="node-text">
          <div class="node-label">E-mail recebido</div>
          <div class="node-sub">Trigger · Gmail / IMAP</div>
        </div>
        <div class="node-status"><div class="status-dot" style="background:#22c55e;"></div></div>
      </div>
      <div class="port port-out live"></div>
    </div>

    <div class="spacer"></div>

    <!-- Node 2 -->
    <div class="node active-node" id="n2">
      <div class="node-accent" style="background:#6366f1;"></div>
      <div class="node-body">
        <div class="node-icon" style="background:rgba(99,102,241,.14);">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2a6 6 0 100 12A6 6 0 008 2z" stroke="#818cf8" stroke-width="1.4"/><path d="M5.5 8.5l1.5 1.5L10.5 6" stroke="#818cf8" stroke-width="1.4" stroke-linecap="round"/></svg>
        </div>
        <div class="node-text">
          <div class="node-label">Classificar com IA</div>
          <div class="node-sub">OpenAI · gpt-4o-mini</div>
        </div>
        <div class="node-status"><div class="status-dot" style="background:#6366f1;"></div></div>
      </div>
      <div class="port port-in live"></div>
      <div class="port port-out live"></div>
    </div>

    <div class="spacer"></div>

    <!-- Node 3 -->
    <div class="node" id="n3">
      <div class="node-accent" style="background:#0ea5e9;"></div>
      <div class="node-body">
        <div class="node-icon" style="background:rgba(14,165,233,.14);">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="#0ea5e9" stroke-width="1.4"/><path d="M5 6h6M5 8.5h6M5 11h4" stroke="#0ea5e9" stroke-width="1.2" stroke-linecap="round"/></svg>
        </div>
        <div class="node-text">
          <div class="node-label">Registrar no CRM</div>
          <div class="node-sub">HubSpot · criar contato</div>
        </div>
        <div class="node-status"><div class="status-dot" style="background:#22c55e;"></div></div>
      </div>
      <div class="port port-in live"></div>
      <div class="port port-out live"></div>
    </div>

    <div class="spacer"></div>

    <!-- Node 4 -->
    <div class="node" id="n4">
      <div class="node-accent" style="background:#22c55e;"></div>
      <div class="node-body">
        <div class="node-icon" style="background:rgba(34,197,94,.14);">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M13.5 2.5C12 1 10 0.5 8.5 0.5 4.6 0.5 1.5 3.6 1.5 7.5c0 1.2.3 2.4.9 3.4L1.5 15l4.1-1C6.6 14.6 7.5 15 8.5 15c3.9 0 7-3.1 7-7.5 0-1.5-.5-3.5-2-5z" stroke="#22c55e" stroke-width="1.4"/></svg>
        </div>
        <div class="node-text">
          <div class="node-label">Responder WhatsApp</div>
          <div class="node-sub">Z-API · msg personalizada</div>
        </div>
        <div class="node-status"><div class="status-dot" style="background:#22c55e;"></div></div>
      </div>
      <div class="port port-in live"></div>
    </div>
  </div>

  <div class="footer">
    <span class="ft">Kit IAplicada · Modulo 02</span>
    <span class="ft">1.847 execucoes</span>
  </div>
</div>

<script>
  // Draw bezier connector lines between nodes
  function drawLines() {
    const canvas = document.getElementById('canvas');
    const svg = document.getElementById('svg-lines');
    const cr = canvas.getBoundingClientRect();

    const pairs = [['n1','n2'],['n2','n3'],['n3','n4']];

    pairs.forEach(([fromId, toId]) => {
      const from = document.getElementById(fromId);
      const to   = document.getElementById(toId);
      const fr   = from.getBoundingClientRect();
      const tr   = to.getBoundingClientRect();

      const x1 = fr.left + fr.width/2 - cr.left;
      const y1 = fr.bottom - cr.top;
      const x2 = tr.left + tr.width/2 - cr.left;
      const y2 = tr.top - cr.top;

      const cy = (y1 + y2) / 2;

      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', `M${x1},${y1} C${x1},${cy} ${x2},${cy} ${x2},${y2}`);
      path.setAttribute('stroke', 'rgba(255,255,255,0.12)');
      path.setAttribute('stroke-width', '1.5');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-dasharray', '4 3');
      svg.appendChild(path);

      // dot at midpoint
      const mx = (x1+x2)/2, my = (y1+y2)/2;
      const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
      circ.setAttribute('cx', x1);
      circ.setAttribute('cy', String((y1+y2)/2));
      circ.setAttribute('r','2');
      circ.setAttribute('fill','rgba(255,255,255,0.2)');
      svg.appendChild(circ);
    });
  }

  window.addEventListener('load', () => { setTimeout(drawLines, 100); });
</script>
</body>
</html>
